<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Place Objects — V2.0</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; color: #eee; font: 14px/1.4 Inter, system-ui, sans-serif; overflow: hidden; height: 100vh; display: flex; }

    /* Canon backdrop — whitewashed so dragged pieces are visible */
    #canvas-area { flex: 1; position: relative; overflow: hidden; background: #fff; }
    #canon-bg { width: 100%; height: 100%; object-fit: contain; display: block; opacity: 0.6; }
    
    /* Placed objects overlay */
    .placed-marker { position: absolute; width: 20px; height: 20px; border-radius: 50%; background: rgba(142, 219, 184, 0.7); border: 2px solid #8edbb8; transform: translate(-50%, -50%); pointer-events: none; font-size: 9px; display: flex; align-items: center; justify-content: center; color: #050a08; font-weight: 700; }

    /* Sidebar with draggable objects */
    #sidebar { width: 240px; background: #1a1a1a; border-left: 1px solid #333; overflow-y: auto; padding: 12px; }
    #sidebar h2 { font-size: 12px; color: #8edbb8; margin-bottom: 10px; letter-spacing: 0.05em; }
    .obj-card { background: #222; border: 1px solid #333; border-radius: 8px; padding: 6px; margin-bottom: 8px; cursor: grab; transition: border-color 0.2s; }
    .obj-card:hover { border-color: #8edbb8; }
    .obj-card.placed { opacity: 0.3; border-color: #555; pointer-events: none; }
    .obj-card img { width: 100%; border-radius: 4px; pointer-events: none; }
    .obj-card .name { font-size: 10px; font-weight: 600; margin-top: 4px; text-align: center; }
    
    /* Placed pieces on the Canon — actual size crops positioned absolutely */
    .placed-piece { position: absolute; pointer-events: none; border: 2px solid rgba(142, 219, 184, 0.8); border-radius: 2px; box-shadow: 0 0 8px rgba(142, 219, 184, 0.4); }
    .placed-piece img { width: 100%; height: 100%; display: block; }

    /* Drag ghost */
    .dragging { opacity: 0.5; }

    /* Status */
    #status { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); background: rgba(10,23,19,0.9); padding: 8px 16px; border-radius: 6px; font-size: 11px; color: #8edbb8; z-index: 100; }
    
    /* Instructions */
    #instructions { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(10,23,19,0.9); padding: 8px 16px; border-radius: 6px; font-size: 12px; color: #ccc; z-index: 100; }
  </style>
</head>
<body>
  <div id="canvas-area">
    <img id="canon-bg" src="" alt="Canon photo" draggable="false">
  </div>
  <div id="sidebar">
    <h2>OBJECTS</h2>
    <div id="obj-list"></div>
  </div>
  <div id="instructions">Drag objects from the sidebar onto the Canon photo to place them</div>
  <div id="status"></div>

  <script>
    const SESSION_ID = new URLSearchParams(window.location.search).get("session") || "8df83612-1b81-4428-b711-7fbabc9536bb";
    const canonImg = document.getElementById("canon-bg");
    const objList = document.getElementById("obj-list");
    const canvasArea = document.getElementById("canvas-area");
    const statusEl = document.getElementById("status");

    let catalog = [];
    let scene = {};
    let placed = {};
    let canonLoaded = null;  // Canon image element for cropping

    function setStatus(msg) { statusEl.textContent = msg; }

    // Load data
    async function init() {
      // Load Canon image
      canonImg.src = `/api/v2/session/${SESSION_ID}/artifact/hero_canon`;
      
      // Wait for Canon to load so we can crop from it
      canonImg.onload = () => { canonLoaded = canonImg; };

      // Load scene
      try {
        const resp = await fetch(`/api/v2/session/${SESSION_ID}/scene`);
        scene = await resp.json();
      } catch(e) { console.error("Scene load failed", e); }

      // Load catalog for bounding boxes
      let catalogEntries = [];
      try {
        const catResp = await fetch(`/api/v2/session/${SESSION_ID}/artifact/catalog`);
        if (catResp.ok) {
          const catData = await catResp.json();
          catalogEntries = catData.entries || [];
        }
      } catch(e) {}

      // Populate sidebar — use CATALOG entries (real objects with bboxes), not scene.objects
      const objects = catalogEntries.length > 0 ? catalogEntries : (scene.objects || []);
      
      // Wait for Canon to fully load
      await new Promise(r => { if (canonImg.complete && canonImg.naturalWidth) r(); else canonImg.onload = r; });
      
      // Create a hidden canvas for cropping
      const cropCanvas = document.createElement("canvas");
      const cropCtx = cropCanvas.getContext("2d");
      
      objects.forEach((entry, idx) => {
        const card = document.createElement("div");
        card.className = "obj-card";
        card.draggable = true;
        card.dataset.idx = idx;
        card.dataset.uuid = entry.uuid;
        
        // Crop from Canon at this object's bounding box
        let thumbHtml = "";
        const bbox = entry.bbox_in_best_view;
        
        if (bbox && bbox.length === 4) {
          const [x1, y1, x2, y2] = bbox;
          const cw = Math.max(1, x2 - x1);
          const ch = Math.max(1, y2 - y1);
          cropCanvas.width = cw;
          cropCanvas.height = ch;
          cropCtx.drawImage(canonImg, x1, y1, cw, ch, 0, 0, cw, ch);
          const dataUrl = cropCanvas.toDataURL("image/png");
          thumbHtml = `<img src="${dataUrl}" draggable="false">`;
        } else {
          const hue = ((entry.name || "").length * 37 + idx * 73) % 360;
          thumbHtml = `<div style="background:hsl(${hue},50%,35%);width:100%;height:60px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:16px;">${(entry.name || "?").charAt(0).toUpperCase()}</div>`;
        }
        
        card.innerHTML = `${thumbHtml}<div class="name">${entry.name || "unknown"}</div>`;
        
        card.addEventListener("dragstart", (e) => {
          e.dataTransfer.setData("text/plain", idx.toString());
          e.dataTransfer.setData("application/uuid", entry.uuid);
          card.classList.add("dragging");
        });
        card.addEventListener("dragend", () => card.classList.remove("dragging"));
        
        objList.appendChild(card);
      });
        
        card.addEventListener("dragstart", (e) => {
          e.dataTransfer.setData("text/plain", idx.toString());
          card.classList.add("dragging");
        });
        card.addEventListener("dragend", () => card.classList.remove("dragging"));
        
        objList.appendChild(card);
      });

      // Drop zone
      canvasArea.addEventListener("dragover", (e) => { e.preventDefault(); });
      canvasArea.addEventListener("drop", handleDrop);

      setStatus(`${objects.length} objects ready to place`);
    }

    function handleDrop(e) {
      e.preventDefault();
      const idx = parseInt(e.dataTransfer.getData("text/plain"));
      const uuid = e.dataTransfer.getData("application/uuid") || (objects[idx] && objects[idx].uuid);
      const entry = objects[idx];
      if (!entry) return;

      // Get drop position relative to the Canon image
      const rect = canonImg.getBoundingClientRect();
      const px = (e.clientX - rect.left) / rect.width;
      const py = (e.clientY - rect.top) / rect.height;

      // Mark as placed in sidebar
      placed[idx] = { px, py };
      document.querySelectorAll(".obj-card")[idx].classList.add("placed");

      // Place the actual-sized crop on the Canon at the drop point
      const bbox = entry.bbox_in_best_view;
      if (bbox && bbox.length === 4) {
        const [x1, y1, x2, y2] = bbox;
        const bboxW = x2 - x1;
        const bboxH = y2 - y1;
        
        // Scale bbox dimensions to displayed image size
        const displayScale = rect.width / canonImg.naturalWidth;
        const pieceW = bboxW * displayScale;
        const pieceH = bboxH * displayScale;
        
        // Position centered on drop point
        const pieceLeft = (e.clientX - rect.left) - pieceW / 2;
        const pieceTop = (e.clientY - rect.top) - pieceH / 2;
        
        // Create placed piece with the crop
        const piece = document.createElement("div");
        piece.className = "placed-piece";
        piece.style.left = pieceLeft + "px";
        piece.style.top = pieceTop + "px";
        piece.style.width = pieceW + "px";
        piece.style.height = pieceH + "px";
        
        // Crop the Canon at the original bbox
        const cropCanvas2 = document.createElement("canvas");
        cropCanvas2.width = bboxW;
        cropCanvas2.height = bboxH;
        cropCanvas2.getContext("2d").drawImage(canonImg, x1, y1, bboxW, bboxH, 0, 0, bboxW, bboxH);
        const img = document.createElement("img");
        img.src = cropCanvas2.toDataURL();
        piece.appendChild(img);
        canvasArea.appendChild(piece);
      } else {
        // Fallback marker
        const marker = document.createElement("div");
        marker.className = "placed-marker";
        marker.style.left = `${e.clientX - canvasArea.getBoundingClientRect().left}px`;
        marker.style.top = `${e.clientY - canvasArea.getBoundingClientRect().top}px`;
        marker.textContent = (idx + 1).toString();
        canvasArea.appendChild(marker);
      }

      // Send to server for 3D back-projection
      savePlacement(uuid || entry.uuid, px, py, idx);
    }

    async function savePlacement(uuid, px, py, idx) {
      try {
        const resp = await fetch(`/api/v2/session/${SESSION_ID}/place`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ uuid, px, py }),
        });
        const data = await resp.json();
        if (data.position) {
          setStatus(`Placed #${idx+1} at (${data.position.x.toFixed(2)}, ${data.position.y.toFixed(2)}, ${data.position.z.toFixed(2)})`);
        }
      } catch(e) {
        setStatus(`Place failed: ${e.message}`);
      }
    }

    init();
  </script>
</body>
</html>
