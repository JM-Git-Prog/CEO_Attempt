<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Place Objects — V2.0</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; color: #eee; font: 14px/1.4 Inter, system-ui, sans-serif; overflow: hidden; height: 100vh; display: flex; user-select: none; }

    /* Canon backdrop — slightly faded so pieces stand out */
    #canvas-area { flex: 1; position: relative; overflow: hidden; background: #f8f4f0; }
    #canon-bg { width: 100%; height: 100%; object-fit: contain; display: block; opacity: 0.55; pointer-events: none; }
    
    /* Pieces that are being dragged or placed */
    .floating-piece { position: absolute; pointer-events: none; z-index: 50; opacity: 0.85; border: 2px solid #8edbb8; cursor: grabbing; transition: opacity 0.1s; }
    .floating-piece img { width: 100%; height: 100%; display: block; }
    .placed-piece { position: absolute; pointer-events: none; z-index: 40; border: 2px solid rgba(142, 219, 184, 0.6); }
    .placed-piece img { width: 100%; height: 100%; display: block; }

    /* Sidebar with clickable objects */
    #sidebar { width: 220px; background: #1a1a1a; border-left: 1px solid #333; overflow-y: auto; padding: 10px; }
    #sidebar h2 { font-size: 11px; color: #8edbb8; margin-bottom: 8px; letter-spacing: 0.05em; }
    .obj-card { background: #222; border: 1px solid #333; border-radius: 6px; padding: 4px; margin-bottom: 6px; cursor: pointer; transition: border-color 0.2s, transform 0.1s; }
    .obj-card:hover { border-color: #8edbb8; transform: scale(1.02); }
    .obj-card.active { border-color: #ff0; box-shadow: 0 0 8px rgba(255,255,0,0.4); }
    .obj-card.placed { opacity: 0.3; pointer-events: none; }
    .obj-card img { width: 100%; border-radius: 4px; display: block; }
    .obj-card .name { font-size: 9px; font-weight: 600; margin-top: 3px; text-align: center; color: #aaa; }

    /* Status bar */
    #status { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); background: rgba(10,23,19,0.9); padding: 8px 16px; border-radius: 6px; font-size: 11px; color: #8edbb8; z-index: 100; }
    #instructions { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(10,23,19,0.9); padding: 8px 16px; border-radius: 6px; font-size: 12px; color: #ccc; z-index: 100; }
  </style>
</head>
<body>
  <div id="canvas-area">
    <img id="canon-bg" src="" alt="Canon photo">
  </div>
  <div id="sidebar">
    <h2>OBJECTS (click to pick up)</h2>
    <div id="obj-list"></div>
  </div>
  <div id="instructions">Click an object, then click where it goes on the photo</div>
  <div id="status"></div>

  <script>
    const SESSION_ID = new URLSearchParams(window.location.search).get("session") || "8df83612-1b81-4428-b711-7fbabc9536bb";
    const canonImg = document.getElementById("canon-bg");
    const objList = document.getElementById("obj-list");
    const canvasArea = document.getElementById("canvas-area");
    const statusEl = document.getElementById("status");
    const instructionsEl = document.getElementById("instructions");

    let scene = {};
    let catalogEntries = [];
    let activeIdx = -1;       // currently picked-up piece
    let floatingEl = null;    // the piece following the cursor

    function setStatus(msg) { statusEl.textContent = msg; }

    async function init() {
      // Load Canon
      const canonReady = new Promise((resolve) => {
        canonImg.onload = resolve;
        canonImg.onerror = () => { setStatus("Canon failed"); resolve(); };
      });
      canonImg.src = `/api/v2/session/${SESSION_ID}/artifact/hero_canon`;
      await canonReady;

      // Load scene
      try {
        const resp = await fetch(`/api/v2/session/${SESSION_ID}/scene`);
        scene = await resp.json();
      } catch(e) {}

      // Load catalog
      try {
        const resp = await fetch(`/api/v2/session/${SESSION_ID}/artifact/catalog`);
        if (resp.ok) {
          const data = await resp.json();
          catalogEntries = data.entries || [];
        }
      } catch(e) {}

      if (catalogEntries.length === 0) { setStatus("No objects"); return; }

      // Build sidebar with cropped thumbnails
      const cropCanvas = document.createElement("canvas");
      const cropCtx = cropCanvas.getContext("2d");

      catalogEntries.forEach((entry, idx) => {
        const card = document.createElement("div");
        card.className = "obj-card";
        card.dataset.idx = idx;

        const bbox = entry.bbox_in_best_view;
        if (bbox && bbox.length === 4) {
          const [x1, y1, x2, y2] = bbox;
          const cw = Math.max(1, x2 - x1);
          const ch = Math.max(1, y2 - y1);
          cropCanvas.width = cw;
          cropCanvas.height = ch;
          cropCtx.drawImage(canonImg, x1, y1, cw, ch, 0, 0, cw, ch);
          card.innerHTML = `<img src="${cropCanvas.toDataURL()}" data-idx="${idx}"><div class="name">${entry.name}</div>`;
        } else {
          card.innerHTML = `<div class="name">${entry.name}</div>`;
        }

        // Click to pick up
        card.addEventListener("click", () => pickUp(idx));
        objList.appendChild(card);
      });

      // Canvas area: mousemove to track piece, click to place
      canvasArea.addEventListener("mousemove", onMouseMove);
      canvasArea.addEventListener("click", onCanvasClick);

      setStatus(`${catalogEntries.length} objects — click one to pick it up`);
    }

    function pickUp(idx) {
      // Deactivate previous
      if (activeIdx >= 0) {
        document.querySelectorAll(".obj-card")[activeIdx].classList.remove("active");
      }
      if (floatingEl) { floatingEl.remove(); floatingEl = null; }

      activeIdx = idx;
      document.querySelectorAll(".obj-card")[idx].classList.add("active");

      // Create the floating piece at actual Canon-scale size
      const entry = catalogEntries[idx];
      const bbox = entry.bbox_in_best_view;
      if (!bbox || bbox.length !== 4) return;

      const [x1, y1, x2, y2] = bbox;
      const bboxW = x2 - x1;
      const bboxH = y2 - y1;

      // Scale to displayed Canon size
      const rect = canonImg.getBoundingClientRect();
      const scale = rect.width / canonImg.naturalWidth;
      const pieceW = bboxW * scale;
      const pieceH = bboxH * scale;

      // Create crop image
      const cropCanvas = document.createElement("canvas");
      cropCanvas.width = bboxW;
      cropCanvas.height = bboxH;
      cropCanvas.getContext("2d").drawImage(canonImg, x1, y1, bboxW, bboxH, 0, 0, bboxW, bboxH);

      floatingEl = document.createElement("div");
      floatingEl.className = "floating-piece";
      floatingEl.style.width = pieceW + "px";
      floatingEl.style.height = pieceH + "px";
      floatingEl.style.display = "none"; // shown on first mousemove over canvas
      const img = document.createElement("img");
      img.src = cropCanvas.toDataURL();
      floatingEl.appendChild(img);
      canvasArea.appendChild(floatingEl);

      instructionsEl.textContent = `Placing: ${entry.name} — click on the photo to set position`;
      setStatus(`Move mouse over the photo, click to place`);
    }

    function onMouseMove(e) {
      if (!floatingEl || activeIdx < 0) return;
      const rect = canvasArea.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const pw = parseFloat(floatingEl.style.width);
      const ph = parseFloat(floatingEl.style.height);
      floatingEl.style.left = (x - pw / 2) + "px";
      floatingEl.style.top = (y - ph / 2) + "px";
      floatingEl.style.display = "block";
    }

    function onCanvasClick(e) {
      if (activeIdx < 0 || !floatingEl) return;

      const entry = catalogEntries[activeIdx];
      const rect = canonImg.getBoundingClientRect();
      const px = (e.clientX - rect.left) / rect.width;
      const py = (e.clientY - rect.top) / rect.height;

      // Lock the piece in place
      floatingEl.className = "placed-piece";
      floatingEl.style.pointerEvents = "none";
      floatingEl = null;

      // Mark sidebar card as placed
      document.querySelectorAll(".obj-card")[activeIdx].classList.remove("active");
      document.querySelectorAll(".obj-card")[activeIdx].classList.add("placed");

      // Send placement to server
      savePlacement(entry.uuid, px, py, activeIdx);
      activeIdx = -1;
      instructionsEl.textContent = "Click an object, then click where it goes on the photo";
    }

    async function savePlacement(uuid, px, py, idx) {
      try {
        const resp = await fetch(`/api/v2/session/${SESSION_ID}/place`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ uuid, px, py }),
        });
        const data = await resp.json();
        if (data.position) {
          setStatus(`Placed at (${data.position.x.toFixed(2)}, ${data.position.y.toFixed(2)}, ${data.position.z.toFixed(2)}) — ${catalogEntries.length - document.querySelectorAll('.obj-card.placed').length} remaining`);
        }
      } catch(e) {
        setStatus(`Error: ${e.message}`);
      }
    }

    init();
  </script>
</body>
</html>
