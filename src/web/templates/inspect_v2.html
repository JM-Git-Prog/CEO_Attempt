<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pipeline Inspector — The Living Room</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    /* ─── Design tokens ─────────────────────────────────────────────── */
    :root {
      --bg: #0a0e14;
      --bg-panel: #121820;
      --bg-panel-hi: #18202b;
      --bg-elev: #1c2732;
      --border: #26303d;
      --border-hi: #364656;
      --text: #e6edf3;
      --text-dim: #8b98a6;
      --text-faint: #5a6673;
      --accent: #4bd6a0;
      --accent-dim: #2a7d5f;
      --amber: #e0b341;
      --red: #e06a5c;
      --shadow: 0 2px 8px rgba(0,0,0,0.35), 0 8px 24px rgba(0,0,0,0.25);
      --shadow-hi: 0 4px 16px rgba(0,0,0,0.45), 0 16px 48px rgba(0,0,0,0.35);
      --radius: 12px;
      --radius-sm: 8px;
      --dur: 200ms;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --mono: "SF Mono", "Cascadia Code", "Fira Code", Consolas, monospace;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Top bar ────────────────────────────────────────────────────── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 24px;
      background: linear-gradient(180deg, #10161e 0%, #0c1119 100%);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .topbar h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin: 0;
    }
    .topbar .sub {
      color: var(--text-dim);
      font-size: 12px;
      font-family: var(--mono);
    }
    .topbar .spacer { flex: 1; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border: 1px solid var(--border-hi);
      background: var(--bg-elev);
      color: var(--text-dim);
    }
    .pill .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text-faint);
    }
    .pill.ok { color: var(--accent); border-color: var(--accent-dim); }
    .pill.ok .dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .pill.building { color: var(--amber); border-color: #6b5518; }
    .pill.building .dot { background: var(--amber); }

    /* ─── Filmstrip ──────────────────────────────────────────────────── */
    .strip-wrap {
      padding: 20px 24px 32px;
      overflow-x: auto;
      overflow-y: hidden;
    }
    .strip {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(0, 1fr);
      gap: 0;
      align-items: stretch;
      min-height: calc(100vh - 130px);
    }
    /* On narrower-than-ultrawide, keep panels a readable min width and scroll. */
    @media (max-width: 1600px) {
      .strip { grid-auto-columns: minmax(300px, 1fr); }
    }

    .stage {
      display: flex;
      align-items: stretch;
      min-width: 0;
    }
    .stage .connector {
      flex: 0 0 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--border-hi);
    }
    .stage:last-child .connector { display: none; }
    .stage .connector svg { width: 20px; height: 20px; }

    /* ─── Panel card ─────────────────────────────────────────────────── */
    .card {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: transform var(--dur) var(--ease),
                  box-shadow var(--dur) var(--ease),
                  border-color var(--dur) var(--ease);
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hi);
      border-color: var(--border-hi);
    }
    .card.absent { opacity: 0.55; }

    .card-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-panel-hi);
    }
    .card-num {
      flex: 0 0 auto;
      width: 22px; height: 22px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 6px;
      background: var(--bg-elev);
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
    }
    .card-title {
      flex: 1 1 auto;
      min-width: 0;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-dot {
      flex: 0 0 auto;
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--text-faint);
    }
    .status-dot.complete { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .status-dot.absent { background: var(--text-faint); }
    .status-dot.building { background: var(--amber); }

    .card-body {
      flex: 1 1 auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
      overflow: hidden;
    }

    /* ─── Media (image / thumbnail) with fixed aspect to prevent CLS ── */
    .media {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: var(--radius-sm);
      background: var(--bg-elev);
      border: 1px solid var(--border);
      overflow: hidden;
      flex: 0 0 auto;
    }
    .media img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .media.clickable { cursor: pointer; }
    .media.clickable:hover .media-overlay { opacity: 1; }
    .media-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10,14,20,0.45);
      opacity: 0;
      transition: opacity var(--dur) var(--ease);
    }
    .media-overlay .icon {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(28,39,50,0.9);
      border: 1px solid var(--border-hi);
      color: var(--text);
      font-size: 12px; font-weight: 600;
    }
    .media-overlay svg { width: 16px; height: 16px; }

    /* 3D thumbnail placeholder (Stage 7 & 8) */
    .thumb-3d {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 10px;
      background:
        radial-gradient(120% 90% at 50% 20%, #1e2a36 0%, #141c26 55%, #0e141c 100%);
    }
    .thumb-3d .cube { width: 46px; height: 46px; color: var(--accent); opacity: 0.9; }
    .thumb-3d .lbl { font-size: 11px; color: var(--text-dim); letter-spacing: 0.05em; }

    /* ─── KV rows / JSON summary ─────────────────────────────────────── */
    .kv {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 12px;
      font-size: 12.5px;
    }
    .kv dt { color: var(--text-dim); white-space: nowrap; }
    .kv dd { margin: 0; color: var(--text); text-align: right; font-variant-numeric: tabular-nums; }

    .taglist { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      padding: 3px 9px;
      border-radius: 6px;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      font-size: 11.5px;
      color: var(--text-dim);
    }

    .note {
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.5;
    }

    /* ─── Count badge + mesh grid (Stage 6) ──────────────────────────── */
    .count-badge {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border-radius: 999px;
      background: linear-gradient(180deg, #1a2530, #141c26);
      border: 1px solid var(--border-hi);
      color: var(--text);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: border-color var(--dur) var(--ease), transform var(--dur) var(--ease);
    }
    .count-badge:hover { border-color: var(--accent-dim); transform: translateY(-1px); }
    .count-badge .n { color: var(--accent); font-variant-numeric: tabular-nums; }
    .count-badge .chev { transition: transform var(--dur) var(--ease); }
    .count-badge.open .chev { transform: rotate(180deg); }

    .mesh-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height var(--dur) var(--ease), opacity var(--dur) var(--ease);
    }
    .mesh-grid.open {
      max-height: 460px;
      opacity: 1;
      overflow-y: auto;
    }
    .mesh-chip {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 9px;
      border-radius: var(--radius-sm);
      background: var(--bg-elev);
      border: 1px solid var(--border);
      transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
      cursor: pointer;
    }
    .mesh-chip:hover { border-color: var(--border-hi); background: var(--bg-panel-hi); }
    .mesh-chip .name {
      font-size: 12px; font-weight: 600; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .mesh-chip .meta { font-size: 10.5px; color: var(--text-faint); font-family: var(--mono); }
    .mesh-chip .badge-ph {
      align-self: flex-start;
      font-size: 9.5px; padding: 1px 6px; border-radius: 4px;
      background: #4a2020; color: #e0a0a0; letter-spacing: 0.03em;
    }
    .mesh-chip .badge-real {
      align-self: flex-start;
      font-size: 9.5px; padding: 1px 6px; border-radius: 4px;
      background: #1a3d2e; color: #8edbb8; letter-spacing: 0.03em;
    }

    /* ─── HITL verdict footer ────────────────────────────────────────── */
    .verdict {
      display: flex;
      gap: 8px;
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      background: var(--bg-panel-hi);
      margin-top: auto;
    }
    .vbtn {
      flex: 1;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-elev);
      color: var(--text-dim);
      font-size: 12px; font-weight: 600;
      cursor: pointer;
      transition: all var(--dur) var(--ease);
    }
    .vbtn:hover:not(:disabled) { border-color: var(--border-hi); color: var(--text); }
    .vbtn:disabled { opacity: 0.4; cursor: not-allowed; }
    .vbtn.approve.active { background: #163a2b; border-color: var(--accent-dim); color: var(--accent); }
    .vbtn.reject.active { background: #3a1c1c; border-color: #5c3030; color: var(--red); }
    .vbtn svg { width: 15px; height: 15px; }

    /* ─── Loading skeleton ───────────────────────────────────────────── */
    .skeleton {
      background: linear-gradient(90deg, #141c26 25%, #1c2732 50%, #141c26 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: var(--radius-sm);
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .sk-line { height: 12px; margin: 8px 0; }
    .sk-media { width: 100%; aspect-ratio: 4/3; }

    /* ─── Error boundary ─────────────────────────────────────────────── */
    .err-box {
      display: flex; flex-direction: column; gap: 6px;
      padding: 12px;
      border-radius: var(--radius-sm);
      background: #241417;
      border: 1px solid #5c3030;
      color: #e0a0a0;
      font-size: 12px;
    }
    .err-box .t { font-weight: 700; color: var(--red); }

    .fatal {
      margin: 60px auto;
      max-width: 520px;
      text-align: center;
      color: var(--text-dim);
    }
    .fatal h2 { color: var(--red); }
    .fatal code { color: var(--accent); font-family: var(--mono); }

    /* ─── Modal (expand) ─────────────────────────────────────────────── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(6,9,13,0.8);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--dur) var(--ease);
    }
    .modal-backdrop.open { opacity: 1; pointer-events: auto; }
    .modal {
      width: min(92vw, 1100px);
      height: min(88vh, 820px);
      background: var(--bg-panel);
      border: 1px solid var(--border-hi);
      border-radius: var(--radius);
      box-shadow: var(--shadow-hi);
      display: flex; flex-direction: column;
      transform: scale(0.96);
      transition: transform var(--dur) var(--ease);
      overflow: hidden;
    }
    .modal-backdrop.open .modal { transform: scale(1); }
    .modal-head {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-panel-hi);
    }
    .modal-head h3 { margin: 0; font-size: 15px; }
    .modal-head .spacer { flex: 1; }
    .modal-close {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-elev);
      color: var(--text-dim);
      cursor: pointer;
      transition: all var(--dur) var(--ease);
    }
    .modal-close:hover { color: var(--text); border-color: var(--border-hi); }
    .modal-body {
      flex: 1; min-height: 0;
      display: flex; align-items: center; justify-content: center;
      background:
        radial-gradient(120% 90% at 50% 10%, #16202b 0%, #0e141c 70%);
      padding: 12px;
    }
    .modal-body img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: var(--radius-sm); }
    .modal-body model-viewer { width: 100%; height: 100%; --poster-color: transparent; }

    ::-webkit-scrollbar { height: 10px; width: 10px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 6px; }
    ::-webkit-scrollbar-thumb:hover { background: #45596b; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>Pipeline Inspector</h1>
    <span class="sub" id="sessionLabel">loading…</span>
    <div class="spacer"></div>
    <span class="pill" id="statePill"><span class="dot"></span><span id="stateText">—</span></span>
  </div>

  <div class="strip-wrap">
    <div class="strip" id="strip"><!-- panels injected by inspector.js --></div>
  </div>

  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <div class="modal-head">
        <h3 id="modalTitle">Preview</h3>
        <div class="spacer"></div>
        <button class="modal-close" id="modalClose" aria-label="Close">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="/static/inspector.js"></script>
</body>
</html>
